version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: mads-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mads_redesign
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mads_redesign"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mads-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=mads_redesign;Username=postgres;Password=postgres
      Frontend__Origin: http://localhost:5173
    ports:
      - "5048:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5048/api
    container_name: mads-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres-data:
